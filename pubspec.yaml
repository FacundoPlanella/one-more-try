name: one_more_try
description: "One more try. — casual one-tap endless lane game (offline, banner ads only)."
publish_to: 'none'
version: 1.0.1+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  audioplayers: ^6.8.1
  google_fonts: ^8.2.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B0D10"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/music_loop.wav
    - assets/audio/sfx/tap.wav
    - assets/audio/sfx/orb.wav
    - assets/audio/sfx/die.wav
    - assets/audio/sfx/best.wav
    - assets/branding/app_icon.png
    - assets/branding/logo_one_more_try.png
    - assets/images/creatures/players/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/obstacles/
